name: leaderboard

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of repos to scan"
        required: false
        default: "100"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run leaderboard scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEADERBOARD_LIMIT: ${{ github.event.inputs.limit || '100' }}
          AGENTLINT_CLI_PATH: ${{ github.workspace }}/packages/cli/dist/index.js
        run: pnpm --filter @agentlinthq/leaderboard run start
      - name: Commit aggregated JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "agentlint-bot"
          git config user.email "noreply@agentlint.sh"
          git add tools/leaderboard/data/aggregated/
          if git diff --cached --quiet; then
            echo "No leaderboard changes to commit."
            exit 0
          fi
          DATESTAMP=$(date -u +%Y-%m-%d)
          git commit -m "chore(leaderboard): scheduled scan ${DATESTAMP}"
          git push origin HEAD:main
